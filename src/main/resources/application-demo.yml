# Profil « demo » : base H2 en mémoire + produits et comptes d'exemple.
# Aucun Docker nécessaire. Les données sont effacées à chaque arrêt.
# ⚠ Les secrets et mots de passe ci-dessous sont PUBLICS : ils servent seulement à essayer l'API.
spring:
  datasource:
    url: jdbc:h2:mem:commandes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: secret-de-demo-public-ne-pas-utiliser-en-production
  comptes-initiaux:
    gerant-telephone: "690000001"
    gerant-mot-de-passe: demo-gerant-2026
    livreur-telephone: "677000000"
    livreur-mot-de-passe: demo-livreur-2026
