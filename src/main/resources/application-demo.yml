# Profil « demo » : base H2 en mémoire + produits d'exemple.
# Aucun Docker nécessaire. Les données sont effacées à chaque arrêt.
spring:
  datasource:
    url: jdbc:h2:mem:commandes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  h2:
    console:
      enabled: true
      path: /h2-console
