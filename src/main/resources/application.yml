# Configuration par défaut : PostgreSQL (lancé avec docker compose).
# Les valeurs entre ${...} peuvent être remplacées par des variables d'environnement.
spring:
  application:
    name: api-commandes-livraisons
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commandes}
    username: ${DB_USER:commandes}
    password: ${DB_PASSWORD:commandes}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crée les tables ; Hibernate vérifie seulement qu'elles correspondent au code.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}
