# Configuration par défaut : PostgreSQL (lancé avec docker compose).
# Les valeurs entre ${...} peuvent être remplacées par des variables d'environnement.
spring:
  application:
    name: api-commandes-livraisons
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commandes}
    username: ${DB_USER:commandes}
    password: ${DB_PASSWORD:commandes}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crée les tables ; Hibernate vérifie seulement qu'elles correspondent au code.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

# Sécurité. En production, ces valeurs viennent de variables d'environnement, jamais du code.
app:
  jwt:
    # Clé secrète de signature des jetons : 32 caractères minimum (variable JWT_SECRET).
    secret: ${JWT_SECRET:}
    # Durée de validité d'un jeton (ex. 8h, 30m).
    duree: ${JWT_DUREE:8h}
  comptes-initiaux:
    # Premier compte gérant, créé au démarrage s'il n'existe encore aucun compte.
    gerant-telephone: ${GERANT_TELEPHONE:}
    gerant-mot-de-passe: ${GERANT_MOT_DE_PASSE:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}
